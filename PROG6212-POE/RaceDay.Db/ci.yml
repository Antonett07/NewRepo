name: RaceDay CI/CD Build & Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Solution (API, MVC, and Tests)
        run: dotnet build --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test RaceDay.Test/RaceDay.Test.csproj --no-build --configuration Release --verbosity normal

      - name: Verify MVC Docker Image Builds
        if: hashFiles('RaceDay.Web/Dockerfile') != ''
        run: docker build -t raceday-web:ci -f RaceDay.Web/Dockerfile .